version: 2.1

# ---------------------------------------------------------------------------
# Branch -> image tag
#
#   main      ->  :qa      lint + unit tests run, then build and push
#   staging   ->  :stage   no tests, just build and push
#   prod      ->  :prod    no tests, just build and push
#
# Set these in CircleCI: Project Settings -> Environment Variables
#   DOCKERHUB_USER      your Docker Hub username
#   DOCKERHUB_TOKEN     a Docker Hub access token (not your password)
# ---------------------------------------------------------------------------

jobs:

  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run: pip install ruff
      - run: ruff check app/

  unit:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - restore_cache:
          keys: ["pip-{{ checksum \"requirements.txt\" }}"]
      - run: pip install -r requirements.txt pytest pytest-cov
      - save_cache:
          key: pip-{{ checksum "requirements.txt" }}
          paths: ["~/.cache/pip"]
      - run:
          name: Unit tests with coverage
          command: |
            pytest tests/unit -v \
              --cov=app --cov-report=term-missing \
              --cov-report=html:coverage \
              --junitxml=test-results/results.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage
          destination: coverage

  # One job, reused by all three branches. The tag comes in as a parameter.
  build_and_push:
    parameters:
      tag:
        type: string
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker          # without this, docker build cannot connect
      - run:
          name: Log in to Docker Hub
          command: |
            if [ -z "$DOCKERHUB_USER" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
              echo "DOCKERHUB_USER / DOCKERHUB_TOKEN are not set."
              echo "Add them in Project Settings -> Environment Variables."
              exit 1
            fi
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
      - run:
          name: Build
          command: |
            IMAGE="$DOCKERHUB_USER/project-assigner"
            docker build -t "$IMAGE:<< parameters.tag >>" -t "$IMAGE:<< parameters.tag >>-$CIRCLE_SHA1" .
      - run:
          name: Push
          command: |
            IMAGE="$DOCKERHUB_USER/project-assigner"
            docker push "$IMAGE:<< parameters.tag >>"
            docker push "$IMAGE:<< parameters.tag >>-$CIRCLE_SHA1"
            echo "pushed $IMAGE:<< parameters.tag >>"

workflows:

  # main -> QA. This is the only branch that runs the tests.
  qa:
    jobs:
      - lint:
          filters: { branches: { only: main } }
      - unit:
          filters: { branches: { only: main } }
      - build_and_push:
          name: push-qa
          tag: qa
          requires: [lint, unit]
          filters: { branches: { only: main } }

  # staging -> promote the same code, no tests.
  staging:
    jobs:
      - build_and_push:
          name: push-stage
          tag: stage
          filters: { branches: { only: staging } }

  # prod -> promote, no tests.
  production:
    jobs:
      - build_and_push:
          name: push-prod
          tag: prod
          filters: { branches: { only: prod } }
