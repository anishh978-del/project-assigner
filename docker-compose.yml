services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assigner
      POSTGRES_PASSWORD: assigner
      POSTGRES_DB: assigner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assigner -d assigner"]
      interval: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 15

  migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: assigner
    volumes:
      - ./migrations:/migrations:ro
    command: >
      sh -c 'for f in /migrations/*.sql; do
               echo "applying $$f";
               psql -h db -U assigner -d assigner -v ON_ERROR_STOP=1 -f "$$f" || exit 1;
             done; echo "migrations done"'
    depends_on:
      db: { condition: service_healthy }

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://assigner:assigner@db:5432/assigner
      REDIS_URL: redis://cache:6379
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
