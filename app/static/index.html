<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capstone Jackpot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--felt:#231042;--deep:#0b0618;--brass:#ffc93c;--dim:#8f6fd0;--neon:#ff2e88;
 --cyan:#22f0ff;--cream:#ffffff;--ink:#0b0618;--muted:#d9c9ff;
 --fd:"Bungee",Impact,sans-serif;--fb:"Archivo",Arial,sans-serif;--fm:"JetBrains Mono",Menlo,monospace;
 color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0;min-height:100%}
body{font-family:var(--fb);color:var(--cream);
 background:radial-gradient(ellipse 100% 60% at 50% -8%,#4a1570 0%,transparent 62%),radial-gradient(ellipse 80% 50% at 85% 100%,#1b0a3a 0%,transparent 60%),var(--deep)}
.wrap{max-width:1060px;margin:0 auto;padding:22px 16px 48px}
header{text-align:center;margin-bottom:16px}
h1{font-family:var(--fd);font-size:clamp(26px,6.5vw,50px);margin:0;color:var(--brass);
 text-shadow:0 0 26px rgba(255,201,60,.55),0 0 54px rgba(255,46,136,.35),0 3px 0 #000;line-height:1}
header p{margin:9px 0 0;color:var(--cream);font-size:15px}
.status{display:inline-flex;gap:14px;margin-top:10px;font-family:var(--fm);font-size:12px;flex-wrap:wrap;justify-content:center}
.dot{display:inline-flex;align-items:center;gap:5px;color:var(--cream)}
.dot i{width:8px;height:8px;border-radius:50%;background:#555}
.dot.ok i{background:#00e5ff;box-shadow:0 0 8px #00e5ff}.dot.bad i{background:var(--neon)}
.rail{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:center;
 background:linear-gradient(#2e1458,#190a33);border:1px solid var(--dim);border-radius:10px;
 padding:12px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700}
input,select{font-family:var(--fm);font-size:13px;color:var(--cream);background:var(--deep);
 border:1px solid var(--dim);border-radius:6px;padding:7px 9px;min-width:0}
input[type=number]{width:78px} input[type=file]{font-family:var(--fb);font-size:12px;padding:5px}
button{font-family:var(--fb);font-weight:700;font-size:13px;cursor:pointer;background:var(--brass);
 color:var(--ink);border:0;border-radius:6px;padding:9px 15px}
button.ghost{background:transparent;color:var(--brass);border:1px solid var(--dim)}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
a.dl{display:inline-block;font-family:var(--fb);font-weight:700;font-size:13px;
 background:var(--brass);color:var(--ink);border-radius:6px;padding:9px 15px;text-decoration:none}
.cabinet{background:linear-gradient(#32175f,#190a33);border:3px solid var(--brass);border-radius:16px;
 padding:18px;box-shadow:0 0 0 1px #000 inset,0 16px 40px rgba(0,0,0,.5);
 display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.reels{display:grid;grid-template-columns:1fr 1fr 86px;gap:10px;min-width:0}
.reel{background:#000;border:2px solid var(--brass);border-radius:8px;height:104px;
 overflow:hidden;position:relative;min-width:0}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(#000 0%,transparent 30%,transparent 70%,#000 100%)}
.strip{display:flex;flex-direction:column;will-change:transform}
.cell{height:104px;display:flex;align-items:center;justify-content:center;padding:6px 10px;
 text-align:center;line-height:1.15;font-size:clamp(12px,2.1vw,16px);font-weight:700}
.cell.proj{color:var(--cyan);text-shadow:0 0 12px rgba(0,229,255,.5)}
.cell.stu{color:var(--brass);text-shadow:0 0 12px rgba(255,201,60,.45)}
.cell.num{font-family:var(--fd);font-size:28px;color:var(--neon);text-shadow:0 0 14px rgba(255,46,136,.6)}
.spin{font-family:var(--fd);font-size:16px;padding:14px 22px;
 background:linear-gradient(var(--neon),#c00f5e);color:#fff;box-shadow:0 0 30px rgba(255,46,136,.6),0 0 60px rgba(255,46,136,.25)}
.batchHead{font-family:var(--fd);color:var(--brass);font-size:14px;margin:18px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{border:2px solid var(--dim);border-radius:10px;background:rgba(0,0,0,.5);padding:12px;
 opacity:0;transform:translateY(10px);animation:drop .45s ease forwards}
@keyframes drop{to{opacity:1;transform:none}}
.card .nm{font-weight:700;font-size:17px;color:var(--cream)}
.card .us{font-family:var(--fm);font-size:12px;color:var(--cyan);margin-bottom:8px}
.card .pj{color:var(--cyan);font-size:14px;font-weight:700;line-height:1.25}
.card .mt{font-family:var(--fm);font-size:11px;color:var(--neon);margin-top:5px}
.card .rp{display:inline-block;margin-top:7px;font-family:var(--fm);font-size:10px;
  color:var(--brass);text-decoration:none;border:1px solid var(--dim);border-radius:4px;padding:2px 6px}
.card .rp:hover{background:var(--felt)}
.idle{color:var(--cream);font-size:16px;margin:0}
.ledger{margin-top:26px}
.ledger h3{font-family:var(--fd);color:var(--brass);font-size:19px;margin:0 0 10px;
 display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tablewrap{overflow-x:auto;border:2px solid var(--brass);border-radius:10px;background:#140a28}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:600px}
th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#0b0618;
 background:var(--brass);padding:10px 12px;white-space:nowrap;font-weight:700}
td{padding:8px 12px;border-top:1px solid rgba(216,169,58,.18)}
tr:nth-child(odd) td{background:rgba(255,255,255,.05)}
td.mono{font-family:var(--fm);font-size:13px;color:var(--cyan);font-weight:700}
tr.pending td{color:#9d86c9;font-style:italic}
.empty{padding:24px;text-align:center;color:var(--cream);font-size:15px}
.toast{min-height:18px;font-size:14px;color:var(--cyan);margin-top:10px;font-weight:600}
@media (max-width:620px){.cabinet{grid-template-columns:1fr}.reels{grid-template-columns:1fr 1fr 60px}
 .reel,.cell{height:86px}}
@media (prefers-reduced-motion:reduce){.strip{transition:none!important}.card{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Capstone Jackpot</h1>
    <p>One project per student, dealt at random. No choosing, no swapping.</p>
    <div class="status">
      <span class="dot" id="dPg"><i></i>postgres</span>
      <span class="dot" id="dRd"><i></i>redis</span>
      <span class="dot" id="dRun"><i></i><span id="runLabel">no run</span></span>
    </div>
  </header>

  <div class="rail">
    <div class="field"><label for="csv">Upload class CSV</label><input type="file" id="csv" accept=".csv,.txt"></div>
    <div class="field"><label for="cohort">Cohort</label><select id="cohort"></select></div>
    <div class="field"><label for="seed">Seed</label><input type="number" id="seed" value="42"></div>
    <div class="field"><label for="batch">Per spin</label><input type="number" id="batch" min="1" max="10" value="5"></div>
    <div class="field"><label for="pool">Pool</label><select id="pool">
      <option value="all">All 25</option><option value="A">Set A</option>
      <option value="B">Set B</option><option value="starter">Starter ready</option></select></div>
    <div class="field"><label>&nbsp;</label><button id="newRun" type="button">New run</button></div>
    <div class="field"><label>&nbsp;</label><button id="resetRun" class="ghost" type="button">Reset</button></div>
  </div>

  <div class="cabinet">
    <div class="reels" aria-hidden="true">
      <div class="reel"><div class="strip" id="r0"></div></div>
      <div class="reel"><div class="strip" id="r1"></div></div>
      <div class="reel"><div class="strip" id="r2"></div></div>
    </div>
    <div><button class="spin" id="spin" type="button" disabled>SPIN</button></div>
  </div>

  <div id="out"><p class="idle" style="margin-top:16px">Upload a CSV, or pick the demo cohort, then start a run.</p></div>

  <div class="ledger">
    <h3><span>The ledger</span>
      <span style="display:flex;gap:8px;align-items:center">
        <a class="dl" id="dl" href="#" hidden>Download CSV</a>
      </span></h3>
    <div class="tablewrap"><table>
      <thead><tr><th>#</th><th>Student</th><th>USN</th><th>Project</th><th>Status</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="empty">No run yet.</td></tr></tbody>
    </table></div>
    <p class="toast" id="toast"></p>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let PROJECTS=[],runId=null,spinning=false;
const api=async(p,o={})=>{const r=await fetch(p,o);const j=await r.json().catch(()=>({}));
  if(!r.ok&&r.status!==409)throw new Error(j.detail||("HTTP "+r.status));return{status:r.status,body:j};};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{$("toast").textContent=m;setTimeout(()=>{if($("toast").textContent===m)$("toast").textContent="";},3200);};

async function health(){try{const j=await(await fetch("/api/health")).json();
  $("dPg").className="dot "+(j.postgres?"ok":"bad");$("dRd").className="dot "+(j.redis?"ok":"bad");}
  catch(e){$("dPg").className="dot bad";$("dRd").className="dot bad";}}

function strips(names){
  const loops=5;
  [["r0",()=>names,"stu"],["r1",()=>PROJECTS.map(p=>p.title),"proj"],["r2",()=>PROJECTS.map(p=>p.id),"num"]]
  .forEach(([id,get,cls])=>{const el=$(id);const items=get();
    el.style.transition="none";el.style.transform="translateY(0)";
    let h="";for(let l=0;l<loops;l++)for(const v of items)h+=`<div class="cell ${cls}">${esc(v)}</div>`;
    el.innerHTML=h;el.dataset.len=items.length;});
}
function beep(f,d,w){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  window._ac=window._ac||new AC();const ac=window._ac,o=ac.createOscillator(),g=ac.createGain();
  o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,ac.currentTime+w);
  g.gain.exponentialRampToValueAtTime(.14,ac.currentTime+w+.01);
  g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+w+d);
  o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+w);o.stop(ac.currentTime+w+d+.02);}catch(e){}}

function landOne(studentIdx,projIdx,dur){
  const h=window.matchMedia("(max-width:620px)").matches?86:104;
  const reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  [["r0",studentIdx],["r1",projIdx],["r2",projIdx]].forEach(([id,idx],i)=>{
    const el=$(id),len=+el.dataset.len;
    if(reduce){el.style.transition="none";el.style.transform=`translateY(-${idx*h}px)`;return;}
    el.style.transition="none";el.style.transform="translateY(0)";void el.offsetHeight;
    el.style.transition=`transform ${dur}s cubic-bezier(.15,.7,.2,1)`;
    el.style.transform=`translateY(-${(len*2+idx)*h}px)`;
  });
  beep(520,.06,reduce?0:dur*.9);
  return reduce?60:dur*1000+90;
}

async function loadCohorts(sel){
  const{body}=await api("/api/cohorts");
  $("cohort").innerHTML=body.cohorts.map(c=>`<option value="${c.id}">${esc(c.label)} (${c.students})</option>`).join("")
    ||`<option value="">no cohorts</option>`;
  if(sel)$("cohort").value=sel;
}

$("csv").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  const fd=new FormData();fd.append("file",f);
  try{const{body}=await api("/api/cohorts/upload",{method:"POST",body:fd});
    await loadCohorts(body.id);
    toast(`Loaded ${body.students} students from ${f.name}.`);
  }catch(err){toast("Upload failed: "+err.message);}
  e.target.value="";
});

async function newRun(){
  const cid=$("cohort").value; if(!cid){toast("No cohort selected.");return;}
  try{
    const{body}=await api("/api/runs",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({cohort_id:+cid,seed:+$("seed").value||42,
        pool:$("pool").value,batch_size:+$("batch").value||5})});
    runId=body.run_id;
    $("runLabel").textContent=`run ${runId} · ${body.students} students · ${body.batches} spins`;
    $("dRun").className="dot ok";
    $("spin").disabled=false;$("spin").textContent="SPIN";
    $("dl").hidden=false;$("dl").href=`/api/runs/${runId}/export.csv`;
    $("out").innerHTML=`<p class="idle" style="margin-top:16px">${body.students} students, ${body.distinct_projects} projects in play (${body.min_per_project}&ndash;${body.max_per_project} students each). Pull the lever.</p>`;
    await ledger();
    toast(`Run ${runId} written to the database.`);
  }catch(e){toast("Could not start run: "+e.message);}
}

async function spin(){
  if(spinning||!runId)return; spinning=true;$("spin").disabled=true;
  try{
    const{status,body}=await api(`/api/runs/${runId}/reveal`,{method:"POST"});
    if(status===409){$("spin").textContent="ALL DEALT";toast("Every student has a project.");spinning=false;return;}
    strips(body.students.map(s=>s.name));
    const head=document.createElement("div");
    head.innerHTML=`<div class="batchHead">SPIN ${body.batch} &mdash; ${body.students.length} STUDENTS</div><div class="cards" id="c${body.batch}"></div>`;
    if($("out").querySelector(".idle"))$("out").innerHTML="";
    $("out").prepend(head);
    const box=$("c"+body.batch);
    let delay=0;
    for(let i=0;i<body.students.length;i++){
      const s=body.students[i];
      const pIdx=PROJECTS.findIndex(p=>p.id===s.project_id);
      await new Promise(res=>setTimeout(res,delay));
      const wait=landOne(i,pIdx<0?0:pIdx,1.1);
      await new Promise(res=>setTimeout(res,wait));
      beep(900,.1,0);
      const p=s.project||{};
      const el=document.createElement("div");el.className="card";
      el.innerHTML=`<div class="nm">${esc(s.name)}</div><div class="us">${esc(s.usn||"")}</div>
        <div class="pj">${esc(s.project_title)}</div>
        <div class="mt">#${s.project_id} · ${esc(p.language||"Any")}</div>
        ${p.repo?`<a class="rp" href="${esc(p.repo)}" target="_blank" rel="noopener">${esc(p.repo.replace("https://github.com/",""))}</a>`:""}`;
      box.appendChild(el); delay=120;
    }
    beep(1180,.2,0);
    await ledger();
    spinning=false;
    if(body.batches_remaining>0)$("spin").disabled=false; else $("spin").textContent="ALL DEALT";
  }catch(e){toast("Reveal failed: "+e.message);spinning=false;$("spin").disabled=false;}
}

async function ledger(){
  if(!runId)return;
  const{body}=await api(`/api/runs/${runId}`);
  $("rows").innerHTML=body.assignments.map(a=>`<tr class="${a.revealed?"":"pending"}">
    <td class="mono">${a.position}</td><td>${esc(a.name)}</td><td class="mono">${esc(a.usn||"")}</td>
    <td>${a.revealed?esc(a.project_title):"&mdash;"}</td>
    <td class="mono">${a.revealed?"assigned":"pending"}</td></tr>`).join("");
}

$("spin").addEventListener("click",spin);
$("newRun").addEventListener("click",newRun);
$("resetRun").addEventListener("click",async()=>{if(!runId)return;
  await api(`/api/runs/${runId}/reset`,{method:"POST"});
  $("spin").disabled=false;$("spin").textContent="SPIN";
  $("out").innerHTML=`<p class="idle" style="margin-top:16px">Reveals reset. The allocation is unchanged.</p>`;
  await ledger();toast("Reset. Same allocation, nothing re-rolled.");});

(async()=>{await health();setInterval(health,15000);
  const{body}=await api("/api/projects");PROJECTS=body.projects;
  strips(["—"]); await loadCohorts();
  // resume the latest run, so a refresh mid-demo does not lose your place
  try{
    const r=await api("/api/runs");
    if(r.body.runs && r.body.runs.length){
      const last=r.body.runs[0];
      runId=last.id;
      $("runLabel").textContent=`run ${runId} · ${last.students} students`;
      $("dRun").className="dot ok";
      $("spin").disabled=false;
      $("dl").hidden=false; $("dl").href=`/api/runs/${runId}/export.csv`;
      await ledger();
    }
  }catch(e){}
})();
</script>
</body>
</html>
